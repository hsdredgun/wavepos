<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WavePos</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root {
    --bg: #111418; --panel: #1b2027; --key: #252b34; --key-hi: #313946;
    --text: #f2f4f7; --muted: #8a94a3; --accent: #f7931a; --ok: #1fb46a;
    --bad: #d9443a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, sans-serif; touch-action: manipulation;
    user-select: none; -webkit-user-select: none; }
  .screen { display: none; height: 100%; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px 16px; gap: 20px; }
  .screen.on { display: flex; }

  #amount { font-size: clamp(56px, 12vw, 104px); font-weight: 700;
    font-variant-numeric: tabular-nums; }
  #sats, .sub { color: var(--muted); font-size: 22px; min-height: 28px; text-align: center; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    width: min(100%, 460px); }
  .keys button { height: clamp(64px, 11vh, 96px); font-size: 34px; border: 0;
    border-radius: 14px; background: var(--key); color: var(--text); }
  .keys button:active { background: var(--key-hi); }
  .keys .fn { color: var(--muted); font-size: 26px; }
  .big { width: min(100%, 460px); height: 76px; font-size: 28px; font-weight: 700;
    border: 0; border-radius: 14px; background: var(--accent); color: #111; }
  .big:disabled { opacity: .35; }
  .big.ghost { background: var(--key); color: var(--text); }

  #invoice { gap: 12px; }
  #invoice .big { height: 60px; }
  #qr { width: min(80vw, 52vh, 520px); aspect-ratio: 1; background: #fff;
    border-radius: 16px; padding: 12px; cursor: pointer; }
  #inv-amount { font-size: 44px; font-weight: 700; }
  #paid { background: var(--ok); }
  #paid .tick { font-size: 160px; line-height: 1; }
  #paid h1 { font-size: 56px; margin: 0; }
  .notice { display: none; max-width: 460px; padding: 6px 12px; border-radius: 10px;
    background: #2a2213; border: 1px solid var(--accent); color: #f5d9b0;
    font-size: 13px; line-height: 1.35; text-align: center; }
  .notice.on { display: block; }
  #err { color: var(--bad); min-height: 24px; text-align: center; }

  /* Staff alerts (overpaid or late payments) sit above every screen. */
  #alerts { position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; flex-direction: column; gap: 6px; padding: 8px 16px; }
  #alerts:empty { display: none; }
  .alert { display: flex; gap: 12px; align-items: center; max-width: 640px;
    margin: 0 auto; padding: 10px 14px; border-radius: 10px; background: var(--bad);
    color: #fff; font-size: 15px; line-height: 1.35; }
  .alert button { flex: none; padding: 8px 14px; border: 0; border-radius: 8px;
    background: #fff; color: var(--bad); font-weight: 700; font-size: 15px; }
  #paid-extra { color: #fff; font-weight: 700; font-size: 20px; text-align: center; }
</style>
</head>
<body>

<div id="alerts"></div>

<section class="screen on" id="keypad">
  <div id="amount">$0.00</div>
  <div id="sats"></div>
  <div class="keys">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="C" class="fn">C</button><button data-k="0">0</button>
    <button data-k="B" class="fn">&#9003;</button>
  </div>
  <button class="big" id="charge" disabled>Charge</button>
  <div id="err"></div>
</section>

<section class="screen" id="invoice">
  <div class="notice" id="inv-notice"></div>
  <div class="sub" id="inv-part"></div>
  <div id="inv-amount"></div>
  <div class="sub" id="inv-sats"></div>
  <img id="qr" alt="Lightning invoice QR" title="Tap to copy the invoice" hidden>
  <div class="sub" id="inv-state"></div>
  <button class="big" id="retry" hidden>New QR for this payment</button>
  <button class="big ghost" id="cancel">Cancel</button>
</section>

<section class="screen" id="paid">
  <div class="tick">&#10003;</div>
  <h1>Paid</h1>
  <div class="sub" id="paid-amount" style="color:#eafff2"></div>
  <div id="paid-extra"></div>
  <button class="big ghost" id="next">New sale</button>
</section>

<script>
// The server owns each bill: it splits it, creates every QR and watches every
// QR it ever made. This page only shows what the server reports, so a reload
// or a sleeping tablet resumes the bill where it was.
let cents = 0, rate = 0, currency = 'AUD', maxInvoiceSats = 50000, busy = false;
let bill = null, invoice = '';
// pollGen identifies the current poll. Bumping it abandons the old one,
// including a request still in flight.
let pollGen = 0;

const $ = id => document.getElementById(id);
const fmt = c => (c / 100).toLocaleString(undefined, { style: 'currency',
  currency, currencyDisplay: 'narrowSymbol',
  minimumFractionDigits: 2, maximumFractionDigits: 2 });
const STORE = 'wavepos_bill';
const saveBill = id => { try { localStorage.setItem(STORE, id); } catch (e) {} };
const loadBill = () => { try { return localStorage.getItem(STORE); } catch (e) { return null; } };
const clearBill = () => { try { localStorage.removeItem(STORE); } catch (e) {} };

async function api(path, body) {
  const opts = body === undefined ? {} : { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'HTTP ' + r.status), { status: r.status });
  return j;
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
}

function render() {
  $('amount').textContent = fmt(cents);
  $('sats').textContent = rate && cents
    ? '≈ ' + Math.round(cents / 100 / rate * 1e8).toLocaleString() + ' sats' : '';
  $('charge').disabled = cents === 0 || busy;
}

function renderNotices(list) {
  const box = $('alerts');
  box.replaceChildren();
  for (const n of list || []) {
    const row = document.createElement('div');
    row.className = 'alert';
    const text = document.createElement('div');
    text.textContent = n.text;
    const done = document.createElement('button');
    done.textContent = 'Done';
    done.addEventListener('click', async () => {
      try { renderNotices((await api('/api/notice/ack?id=' + n.id, {})).notices); } catch (e) {}
    });
    row.append(text, done);
    box.append(row);
  }
}

async function loadRate() {
  try {
    const j = await api('/api/rate');
    rate = j.btc_price;
    currency = j.currency || currency;
    maxInvoiceSats = j.max_invoice_sats || maxInvoiceSats;
    renderNotices(j.notices);
  } catch (e) {}
  render();
}

document.querySelector('.keys').addEventListener('click', e => {
  const k = e.target.dataset.k;
  if (!k) return;
  $('err').textContent = '';
  if (k === 'C') cents = 0;
  else if (k === 'B') cents = Math.floor(cents / 10);
  else if (cents < 1e7) cents = cents * 10 + Number(k);
  render();
});

$('charge').addEventListener('click', async () => {
  busy = true; render();
  try {
    const v = await api('/api/bill/new', { cents });
    saveBill(v.id);
    showBill(v);
    startPoll(v.id);
  } catch (e) {
    $('err').textContent = e.message;
  } finally {
    busy = false; render();
  }
});

// showBill draws the invoice or paid screen from the server's view of a bill.
function showBill(v) {
  bill = v;
  renderNotices(v.notices);
  if (v.state === 'paid') {
    stopPoll(); clearBill();
    $('paid-amount').textContent = fmt(v.total_cents) + ' ' + currency;
    $('paid-extra').textContent = v.extra_cents
      ? `Customer overpaid ${fmt(v.extra_cents)}. Refund them.` : '';
    show('paid');
    return;
  }
  if (v.state === 'cancelled') {
    stopPoll(); clearBill(); reset();
    return;
  }

  const split = v.parts > 1;
  $('inv-notice').classList.toggle('on', split);
  $('inv-notice').textContent = split
    ? `This POS uses the latest Lightning network system. It's a beta ` +
      `version and can only accept ${maxInvoiceSats.toLocaleString()} sats ` +
      `per payment, so your bill is split into ${v.parts} payments. Sorry!`
    : '';
  $('inv-part').textContent = split
    ? `Payment ${v.part} of ${v.parts}` +
      (v.paid_cents ? ` · ${fmt(v.paid_cents)} paid so far` : '')
    : '';

  const c = v.current;
  $('qr').hidden = !c;
  if (c) {
    if (c.invoice !== invoice) { $('qr').src = c.qr; invoice = c.invoice; }
    $('inv-amount').textContent = fmt(c.cents) + ' ' + currency;
    $('inv-sats').textContent = c.sats.toLocaleString() + ' sats';
  } else {
    invoice = '';
    $('inv-amount').textContent = fmt(v.total_cents - v.paid_cents) + ' ' + currency;
    $('inv-sats').textContent = 'left to pay';
  }
  if (!$('inv-state').dataset.flash) {
    $('inv-state').textContent = v.error
      || (c ? 'Scan with any Lightning wallet · tap the QR to copy'
            : v.can_retry ? 'This QR has expired' : 'Paid ✓ — next QR coming…');
  }
  $('retry').hidden = !v.can_retry;
  show('invoice');
}

// startPoll asks the server about the bill, one request at a time.
function startPoll(id) {
  const gen = ++pollGen;
  const tick = async () => {
    if (gen !== pollGen) return;
    try {
      const v = await api('/api/bill?id=' + encodeURIComponent(id));
      if (gen !== pollGen) return;
      showBill(v);
    } catch (e) {
      if (gen !== pollGen) return;
      if (e.status === 404) {
        // The server restarted and forgot the bill.
        stopPoll(); clearBill(); reset();
        $('err').textContent = 'Lost track of the bill (server restarted). ' +
          'Check the wallet activity before charging again.';
        return;
      }
    }
    setTimeout(tick, 1500);
  };
  setTimeout(tick, 1500);
}

function stopPoll() { pollGen++; }

$('retry').addEventListener('click', async () => {
  if (!bill) return;
  $('retry').disabled = true;
  try {
    showBill(await api('/api/bill/retry?id=' + bill.id, {}));
  } catch (e) {
    $('inv-state').textContent = e.message;
  } finally {
    $('retry').disabled = false;
  }
});

$('cancel').addEventListener('click', async () => {
  if (!bill) { reset(); return; }
  if (bill.paid_cents && !confirm(
    `${fmt(bill.paid_cents)} of this bill is already paid. Cancel the rest?`)) return;
  stopPoll();
  let v = bill;
  try { v = await api('/api/bill/cancel?id=' + bill.id, {}); } catch (e) {}
  clearBill(); reset();
  if (v.paid_cents) {
    $('err').textContent = `Cancelled: ${fmt(v.paid_cents)} paid, ` +
      `${fmt(v.total_cents - v.paid_cents)} still owed.`;
  }
});
$('next').addEventListener('click', reset);

// copyInvoice puts the invoice on the clipboard. navigator.clipboard needs
// HTTPS, so plain-HTTP LAN access falls back to a hidden textarea.
async function copyInvoice() {
  if (!invoice) return;
  let ok = false;
  try {
    await navigator.clipboard.writeText(invoice);
    ok = true;
  } catch (e) {
    const t = document.createElement('textarea');
    t.value = invoice;
    t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t);
    t.select();
    try { ok = document.execCommand('copy'); } catch (e2) {}
    t.remove();
  }
  const state = $('inv-state');
  state.dataset.flash = '1';
  state.textContent = ok ? 'Invoice copied ✓' : 'Copy failed — scan the QR instead';
  setTimeout(() => { delete state.dataset.flash; if (bill) showBill(bill); }, 2000);
}
$('qr').addEventListener('click', copyInvoice);

function reset() {
  stopPoll(); bill = null; invoice = ''; cents = 0;
  $('err').textContent = '';
  render(); show('keypad');
}

// Resume a bill that was open when the page was last closed.
(async () => {
  const id = loadBill();
  if (!id) return;
  try {
    const v = await api('/api/bill?id=' + encodeURIComponent(id));
    if (v.state === 'open') { showBill(v); startPoll(id); } else clearBill();
  } catch (e) { clearBill(); }
})();

loadRate();
setInterval(loadRate, 30000);
</script>
</body>
</html>
